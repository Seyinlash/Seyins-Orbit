<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
  </head>
  <body>
<div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Orbit</span>
        </div>

        <form id="search-form" class="search-bar" role="search">
          <label for="search-input" class="visually-hidden">Search the web</label>
          <input
            id="search-input"
            type="text"
            placeholder="Search the web"
            autocomplete="off"
          />
          <button type="submit" aria-label="Search"></button>
        </form>

        <button id="theme-toggle" class="theme-toggle" type="button">Light mode</button>
      </header>

      <main class="layout">
        <section class="hero">
          <div class="hero-text">
            <h1 id="greeting"></h1>

          </div>
          <div class="hero-time">
            <span id="clock" class="clock"></span>
            <span id="date" class="date"></span>
          </div>
        </section>

        <div class="columns">
          <section class="apod-section" aria-labelledby="apod-heading">
            <h2 id="apod-heading" class="section-heading">NASA Astronomy Picture of the Day</h2>
            <div id="apod-card" aria-live="polite">
            <!-- filled in by components/apodCard.js -->
            </div>
          </section>

          <div class="sidebar">
            <section class="links-card">
              <h2 class="section-heading">Quick links</h2>
              <div id="quick-links" class="quick-links"></div>
            </section>

            <section class="links-card">
              <h2 class="section-heading">GitHub</h2>
              <div id="personal-links" class="personal-links"></div>
            </section>

            <section class="links-card">
              <h2 class="section-heading">Projects</h2>
              <p class="section-note">Code and projects on GitHub.</p>
              <div id="project-links" class="personal-links"></div>
            </section>
          </div>
        </div>
      </main>
    </div>

<script type="module" src="/src/main.js"></script>
  </body>
</html>
